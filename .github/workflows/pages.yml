name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Static site QA
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const htmlFiles = fs.readdirSync(root).filter(f => f.endsWith('.html'));
          const required = ['index.html','search.html','article.html','author.html','journal.html','saved.html','history.html','recent.html','guides.html','topics.html','privacy.html','terms.html','disclaimer.html','contact.html','compare.html'];
          for (const f of required) if (!fs.existsSync(path.join(root,f))) throw new Error('Missing required page: '+f);
          for (const file of htmlFiles) {
            const c = fs.readFileSync(file,'utf8');
            const ids = [...c.matchAll(/\\sid=["']([^"']+)["']/gi)].map(m=>m[1]);
            const dup = ids.filter((id,i)=>ids.indexOf(id)!==i);
            if (dup.length) throw new Error(file+' has duplicate IDs: '+[...new Set(dup)].join(', '));
            if (/href=["'][^"']*undefined|src=["'][^"']*undefined/i.test(c)) throw new Error(file+' contains an undefined local reference');
            for (const m of c.matchAll(/(?:href|src)=["']([^"']+)["']/gi)) {
              const ref = m[1];
              if (!ref || /^(?:https?:|mailto:|javascript:|data:|#)/i.test(ref)) continue;
              const target = ref.split(/[?#]/)[0];
              if (target && !fs.existsSync(path.join(root,target))) throw new Error(file+' references missing '+target);
            }
          }
          const search = fs.readFileSync('search.html','utf8');
          if ((search.match(/id=["']answerLayer["']/g)||[]).length !== 1) throw new Error('search.html answerLayer count is not 1');
          if ((search.match(/id=["']querySuggestions["']/g)||[]).length !== 1) throw new Error('search.html querySuggestions count is not 1');
          const app = fs.readFileSync('app.js','utf8');
          const article = fs.readFileSync('article.js','utf8');
          const saved = fs.readFileSync('saved.js','utf8');
          if (!app.includes('data-compare') || !app.includes('function matchSummary') || !app.includes('function relevanceScore') || !app.includes('function evidenceExcerpt') || !app.includes('function normalizeMatchText') || !app.includes('function rankingSignals') || !app.includes('sourceCount')) throw new Error('Search quality layer is missing');
          if (!app.includes('function buildAnswer')) throw new Error('Search evidence rendering layer is missing');
          if (!article.includes('async function related(work)') || !article.includes('async function references(work)') || !article.includes('async function citedBy(work)') || !article.includes('function relationReasons') || !article.includes('function relationScore') || !article.includes('function sortRelated') || !article.includes('researchPaths')) throw new Error('Article research relationship layer is missing');
          if (!article.includes('savePaperNote') || !article.includes('academicNotes')) throw new Error('Per-paper notes are missing');
          if (!saved.includes('Export BibTeX') && !fs.readFileSync('saved.html','utf8').includes('Export BibTeX')) throw new Error('Citation export UI is missing');
          console.log('Static QA passed for '+htmlFiles.length+' HTML pages.');
          NODE
      - name: Live scholarly API smoke test
        run: |
          node <<'NODE'
          const endpoints = [
            'https://api.openalex.org/works?search=chemistry&per_page=1',
            'https://api.openalex.org/authors?search=Marie%20Curie&per_page=1',
            'https://api.openalex.org/sources?search=Nature&per_page=1',
            'https://api.crossref.org/v1/works?query=chemistry&rows=1'
          ];
          const controller = new AbortController();
          const timer = setTimeout(()=>controller.abort(),15000);
          try {
            for (const url of endpoints) {
              const r = await fetch(url,{signal:controller.signal});
              if (!r.ok) throw new Error(url+' -> HTTP '+r.status);
              await r.json();
            }
            console.log('Live scholarly API smoke test passed.');
          } finally { clearTimeout(timer); }
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
